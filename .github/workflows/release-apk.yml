# Tag-triggered app release: push a v* tag -> CI cross-compiles the Rust
# core, builds the signed release APK, and attaches it to a GitHub release.
# NOTE make_latest=false: `releases/latest` is reserved for the weekly shard
# releases — the app's DB update URL depends on it.
name: release-apk

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core for Android
        # ANDROID_HOME is a runner machine env var — resolve it in the
        # shell, not in ${{ }} expressions (empty there).
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a -t x86_64 \
            -o android/app/src/main/jniLibs build --release -p opencaller-android

      - name: Restore release signing from secrets
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/release.keystore
          {
            echo "storeFile=/tmp/release.keystore"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=opencaller"
            echo "keyPassword=$KS_PASS"
          } > android/keystore.properties

      - name: Build signed release + debug APKs
        run: cd android && ./gradlew assembleRelease assembleDebug

      - name: Stage artifacts
        # Debug build ships too: it carries the simulators/diagnostics for
        # field testing, and is signed with the same release key so
        # debug<->release switches need no uninstall.
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "opencaller-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "opencaller-${GITHUB_REF_NAME}-debug.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: opencaller-*.apk
          make_latest: "false"
          generate_release_notes: true
          body: |
            Signed release build. Offline spam call & SMS shield — no
            accounts, no ads, no contact access; the permission list is the
            privacy policy. DB updates fetch from this repo's shard
            releases and are Ed25519-verified against the pinned key.
