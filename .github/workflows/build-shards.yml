# M1 (PRD §8): weekly cron building signed OCDB shards from public data.
# The signing key lives ONLY in repo secrets (and offline backup) — the
# same key whose public half is pinned in the app.
name: build-shards

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC — matches the weekly epoch
  workflow_dispatch:

permissions:
  contents: write # publish the shard release

jobs:
  us-shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch FTC DNC data (last 30 days)
        run: scripts/fetch-ftc.sh data/ftc 30

      - name: Build + sign shard
        env:
          SHARD_SIGNING_KEY: ${{ secrets.SHARD_SIGNING_KEY_BASE64 }}
        run: |
          echo "$SHARD_SIGNING_KEY" | base64 -d > /tmp/shard_signing.key
          cargo run --release -p opencaller-pipeline -- build \
            --country US \
            --today "$(date -u +%F)" \
            --max-age-days 180 \
            --out us.ocdb \
            --sign /tmp/shard_signing.key \
            data/ftc/*.csv
          rm /tmp/shard_signing.key

      - name: Verify before publishing
        run: |
          cargo run --release -p opencaller-pipeline -- verify \
            --pubkey android/app/src/main/assets/shard_signing.pub us.ocdb

      # The app fetches from releases/latest/download/<file>, so each run
      # publishes a dated release marked latest. Clients verify the Ed25519
      # signature against the pinned pubkey — the release channel needs no
      # trust (PRD §9).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shards-${{ github.run_id }}
          name: "DB shards ${{ github.run_id }}"
          body: "Weekly signed OCDB shards. Verify with android/app/src/main/assets/shard_signing.pub."
          make_latest: "true"
          files: |
            us.ocdb
            us.ocdb.sig
            us.ocdb.manifest.json
