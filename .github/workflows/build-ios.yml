# Builds the iOS app (unsigned IPA) on a macOS runner: Rust core for
# aarch64-apple-ios + XcodeGen + xcodebuild without code signing.
# Signing needs an Apple Developer identity we don't put in CI — users
# sideload the unsigned IPA with AltStore/Sideloadly (free Apple ID),
# which re-signs it on install.
name: build-ios

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    # macos-15 = Xcode 16, required by current xcodegen's project format.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust + seed resources
        run: bash scripts/build-ios-rust.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          # ValidateEmbeddedBinary reads code signatures that unsigned
          # builds intentionally lack ("cannot compute parent bundle
          # path") and Xcode has no working switch to skip it — but the
          # .app with both embedded .appex is fully assembled before that
          # step. Tolerate exactly that error; anything else is fatal,
          # and the artifacts are existence-checked below.
          xcodebuild -project OpenCaller.xcodeproj -scheme OpenCaller \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build 2>&1 | tee xcodebuild.log || true
          if grep "error: " xcodebuild.log \
            | grep -v "cannot compute parent bundle path" | grep -q .; then
            echo "::error::unexpected build errors"; exit 1
          fi
          app="build/Release-iphoneos/OpenCaller.app"
          test -f "$app/OpenCaller"
          test -d "$app/PlugIns/CallDirectoryExtension.appex"
          test -d "$app/PlugIns/MessageFilterExtension.appex"

      - name: Package IPA (ad-hoc signed)
        run: |
          cd ios
          app="build/Release-iphoneos/OpenCaller.app"
          # Diagnostics + normalization: codesign rejects symlinked or
          # oddly-copied resource dirs ("unsuitable ... In subcomponent").
          find "$app" -maxdepth 2 \( -type l -o -type d \) -ls
          # Replace any symlinked resource dirs with real copies.
          find "$app" -maxdepth 1 -type l | while read -r link; do
            real=$(readlink -f "$link"); rm "$link"; cp -R "$real" "$link"
          done
          xattr -cr "$app"
          # Ad-hoc signatures (no certificate needed) carrying the App
          # Group entitlements, inside-out — so sideloading tools can read
          # and remap the entitlements when they re-sign on install.
          codesign -f -s - \
            --entitlements CallDirectoryExtension/CallDirectoryExtension.entitlements \
            "$app/PlugIns/CallDirectoryExtension.appex"
          codesign -f -s - \
            --entitlements MessageFilterExtension/MessageFilterExtension.entitlements \
            "$app/PlugIns/MessageFilterExtension.appex"
          codesign -f -s - \
            --entitlements OpenCaller/OpenCaller.entitlements \
            "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry opencaller-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: opencaller-ios-unsigned
          path: ios/opencaller-ios-unsigned.ipa

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ios/opencaller-ios-unsigned.ipa --clobber
