[package]
name = "opencaller-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenCaller CI data pipeline: public complaint data -> signed OCDB shards"

[dependencies]
opencaller-core = { path = "../opencaller-core" }
csv = "1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
